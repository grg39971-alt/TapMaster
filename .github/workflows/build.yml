name: APK derle
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q TapMaster.zip
      - name: Dolgu ekle (yaklasik 25 MB)
        run: |
          mkdir -p TapMaster/app/src/main/assets
          head -c 23500000 /dev/urandom > TapMaster/app/src/main/assets/pad.bin
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: TapMaster
      - uses: actions/upload-artifact@v4
        with:
          name: TapMaster-apk
          path: TapMaster/app/build/outputs/apk/debug/app-debug.apk
